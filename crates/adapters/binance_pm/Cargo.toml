[package]
name = "nautilus-binance-pm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Binance Portfolio Margin (papi) adapter for the Nautilus trading engine (fuzzy-trading fork)"
publish = false

[lints]
workspace = true

[lib]
name = "nautilus_binance_pm"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
high-precision = [
  "nautilus-binance/high-precision",
  "nautilus-model/high-precision",
]

[dependencies]
nautilus-binance = { workspace = true }
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true }

# 官方 Binance SDK(MIT):只读/对账/listenKey 路径的 wire 层一律走它(官方周更维护)。
# 写路径(下单/撤单)除外——其传输层错误塌缩为字符串,无法区分「确定未达」与
# 「可能已受理」,见 src/sdk.rs 模块文档。版本钉死:官方 major 每周都在涨,升级走显式 diff。
binance-sdk = { version = "=68.1.1", features = ["derivatives_trading_portfolio_margin"] }

anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }

# 运行:cargo run --example binance-pm-ping --package nautilus-binance-pm
[[example]]
name = "binance-pm-ping"
path = "examples/pm_ping_tester.rs"
doc = false

# 运行:sops exec-env secrets.trading.enc.env 'cargo run --example binance-pm-readonly --package nautilus-binance-pm'
[[example]]
name = "binance-pm-readonly"
path = "examples/pm_readonly_tester.rs"
doc = false

[[example]]
name = "binance-pm-stream-probe"
path = "examples/pm_stream_probe.rs"
doc = false
